# Render blueprint for the API. Connect the repo and Render reads this file;
# the values mirror what README.md documents under "## Deploy".
services:
  - type: web
    name: teamusic-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: ALLOWED_ORIGIN
        value: https://teamusic.my.id
