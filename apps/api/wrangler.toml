# Cloudflare Workers deployment for the API.
#
#   bunx wrangler login          # once — same account that owns the zone
#   cd apps/api && bun run deploy
#
# Local dev against the real Worker runtime (workerd, no account needed):
#
#   bun run dev:worker           # serves on :8787

name = "teamusic-api"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

# Attach the API hostname on the same Cloudflare account that owns the zone.
# `custom_domain = true` makes wrangler create the DNS record and certificate
# itself, so nothing has to be pointed by hand; the zone lives on this
# account, which is what makes it possible.
routes = [
  { pattern = "api.teamusic.my.id", custom_domain = true },
]

# Workers delivers these as bindings with the first request; src/config.ts
# picks them up through reconfigure() before the app is built. Nothing else
# is needed: the browser calls iTunes itself (Apple rate-limits datacenter
# addresses), and messages travel browser -> Supabase directly.
[vars]
APP_ENV = "production"
APP_DEBUG = "false"
ALLOWED_ORIGIN = "https://teamusic.my.id"

# Upstash REST endpoint behind the rate limiter (src/rateLimit.ts). Only the
# URL lives here; the token is a Worker secret — `wrangler secret put
# UPSTASH_REDIS_REST_TOKEN` — so it can never land in git. With either value
# missing the limiter stays off, which is what keeps a fresh dev process and
# every check script independent of this file.
UPSTASH_REDIS_REST_URL = "https://perfect-oarfish-226192.upstash.io"

# /api/errors exists to record production crashes; Workers Logs is where
# those lines land (included in the free tier).
[observability]
enabled = true
