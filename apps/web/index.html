<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF9F6" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta
      name="description"
      content="VibeCheck — send an anonymous song message, then mix it by zodiac and mood."
    />
    <link rel="canonical" href="https://teamusic.my.id/" />
    <title>TeaMusic — Say Te Amo Witch a Track</title>

    <!--
      Share previews. WhatsApp and Instagram read these tags from the first
      HTML response and never run the app, so apps/web/functions/[[path]].ts
      rewrites them per message at the edge; these are the defaults that cover
      every other page, including the ones the function does not touch.
      og:url and og:image are absolute because the crawlers will not resolve a
      relative path.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TeaMusic" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="TeaMusic — say te amo with a track." />
    <meta
      property="og:description"
      content="TeaMusic — send an anonymous song message, then mix it by zodiac and mood."
    />
    <meta property="og:url" content="https://teamusic.my.id/" />
    <meta property="og:image" content="https://teamusic.my.id/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="TeaMusic — say te amo with a track. Anonymous song messages with a note attached."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TeaMusic — say te amo with a track." />
    <meta
      name="twitter:description"
      content="TeaMusic — send an anonymous song message, then mix it by zodiac and mood."
    />
    <meta name="twitter:image" content="https://teamusic.my.id/og-default.png" />
    <meta
      name="twitter:image:alt"
      content="TeaMusic — say te amo with a track.. Anonymous song messages with a note attached."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "TeaMusic",
        "url": "https://teamusic.my.id/",
        "description": "Send an anonymous song message, then mix it by zodiac and mood.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
